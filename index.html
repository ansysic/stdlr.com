<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Move along. Nothing to see here.">
  <title>Nothing to see here.</title>
  <style>
:root {
  color-scheme: light;
  background: #fff;
  color: #111;
  font-family: Arial, sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; }

main {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
}

img {
  display: block;
  width: auto;
  height: auto;
  max-width: min(100%, 720px);
  max-height: calc(100vh - 48px);
  max-height: calc(100svh - 48px);
  object-fit: contain;
}
  </style>
</head>
<body>
  <main>
    <img src="./public/nothing-to-see-here.jpg" width="1072" height="604"
      alt="Leslie Nielsen waving people along in front of an explosion. Move along. Nothing to see here."
      fetchpriority="high">
  </main>
</body>
</html>
